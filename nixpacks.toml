# Used when Railway builds with Nixpacks (no Dockerfile). Dockerfile takes priority if present.

[phases.setup]
nixPkgs = ["php82", "php82Extensions.mysqli", "php82Extensions.pdo", "php82Extensions.pdo_mysql"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction || true"]

[start]
cmd = "php -S 0.0.0.0:${PORT:-8080} -t ."
